apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-api
  labels:
    app: threat-api
    tier: backend

spec:
  replicas: 3
  selector:
    matchLabels:
      app: threat-api
      tier: backend
  template:
    metadata:
      labels:
        app: threat-api
        tier: backend
    
    spec:
      containers:
        - name: threat-api
          image: gaddock/threat-api:v1.8
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_HOST
              value: mongo-0.mongo
            - name: MONGO_PORT
              value: '27017'
            - name: MONGO_USERNAME
              value: admin
            - name: MONGO_PASSWORD
              value: secretpass
            - name: MONGO_DB
              value: threat_db
            - name: MONGO_AUTH_SOURCE
              value: admin

---

apiVersion: v1
kind: Service
metadata:
  name: threat-api-svc
  labels:
    app: threat-api
    tier: backend

spec:
  type: NodePort
  selector: 
    app: threat-api
    tier: backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 32000